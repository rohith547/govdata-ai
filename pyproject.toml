[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "govdata-ai"
version = "0.1.0"
description = "Open source AI layer for US government databases — search $210B in unclaimed money across all 50 states"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "Shravya Reddy Yemreddy", email = "shravyareddyyemreddy@gmail.com" }
]
keywords = ["unclaimed-money", "government-data", "ai", "nlp", "fintech", "open-source"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "httpx>=0.27",
  "rapidfuzz>=3.0",
  "pydantic>=2.0",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "jellyfish>=1.0",
  "tenacity>=8.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/rohith547/govdata-ai"
Documentation = "https://govdata-ai.readthedocs.io"
Repository = "https://github.com/rohith547/govdata-ai"
Issues = "https://github.com/rohith547/govdata-ai/issues"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["govdata_ai*"]
